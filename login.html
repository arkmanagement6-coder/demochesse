<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parash Chess Academy | Student Login</title>
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome Vector Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, var(--background), var(--surface-bg));
            position: relative;
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            z-index: 10;
        }

        .role-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .role-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        
        .login-form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        
        .login-form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .login-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        
        #login-error {
            color: #EF4444;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Floating Glow Spheres Styles */
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.16;
            z-index: 1;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .shape-1 {
            animation: floatShape1 12s ease-in-out infinite;
        }

        .shape-2 {
            animation: floatShape2 14s ease-in-out infinite;
        }

        @keyframes floatShape1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        @keyframes floatShape2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, 40px) scale(0.95); }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container header-container">
            <a href="https://paraschessacademy.com/" class="logo" id="header-logo">
                <img src="images/logo.png" alt="Paras Chess Academy" class="logo-img">
            </a>
            <nav>
                <ul class="nav-links">
                    <!-- Nav injected dynamically via JS -->
                </ul>
            </nav>
            <a href="book.html" class="btn btn-primary" style="padding: 10px 20px; font-size:14px;" id="nav-cta-btn">Book Free Class</a>
        </div>
    </header>

    <div class="login-page">
        <!-- Floating shapes for aesthetic -->
        <div class="floating-shape shape-1" style="width: 300px; height: 300px; background: var(--primary); top: 10%; left: 10%;"></div>
        <div class="floating-shape shape-2" style="width: 400px; height: 400px; background: #3b82f6; bottom: -10%; right: 5%;"></div>
        
        <div class="glass-card login-card">
            <div style="margin-bottom: 25px;">
                <img src="images/student_login_hero.png" alt="Student Chess Journey" style="max-width: 140px; max-height: 120px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 8px 16px rgba(108,76,245,0.12)); border-radius: 12px;">
                <h2 style="font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px;">Student Portal</h2>
                <p style="font-size: 14px; color: var(--text-secondary);">Enter your credentials to access your classroom and diagnostics</p>
            </div>
            
            <div id="login-error">Invalid email or password. Please try again.</div>
            
            <form id="login-form">
                <div class="login-form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" class="login-input" placeholder="student@example.com" required>
                </div>
                <div class="login-form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="login-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 15px; margin-top: 10px;" id="login-btn">
                    Authenticate Session
                </button>
            </form>
            
            <!-- Quick Test Credentials Helper Widget -->
            <div style="margin-top: 25px; padding-top: 20px; border-top: 1px dashed var(--border-color); text-align: left;">
                <h4 style="font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-circle-info" style="color: var(--primary);"></i>
                    <span>Quick Login Helper (Student Testing)</span>
                </h4>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button type="button" class="btn btn-secondary quick-fill-btn" data-role="student" data-email="kabir.mehta@gmail.com" data-pass="student123" style="width: 100%; padding: 8px 12px; font-size: 11px; justify-content: flex-start; text-align: left; background: rgba(108,76,245,0.03); border: 1px solid var(--border-color); border-radius: 6px;">
                        <i class="fa-solid fa-user-graduate" style="margin-right: 6px; width: 14px;"></i>
                        <span>Student Kabir (kabir.mehta@gmail.com / student123)</span>
                    </button>
                </div>
            </div>
            
            <div style="margin-top: 25px; font-size: 13px; color: var(--text-muted);">
                Trouble logging in? <a href="#" style="color: var(--primary);">Contact Student Support</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
